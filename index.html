<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Bordo Digital — Acesso</title>
<link rel="stylesheet" href="css/style.css?v=202609120516">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">DB</div>
      <div class="brand-text">
        <b>Diário de Bordo Digital</b>
        <span>Brigada de Incêndio Industrial</span>
      </div>
    </div>

    <h1>Acessar sistema</h1>
    <p class="sub">Identifique-se para iniciar o registro do turno.</p>

    <form id="loginForm">
      <div class="field">
        <label for="equipe">Equipe / empresa</label>
        <select id="equipe" required>
          <option value="" disabled selected>Selecione a equipe</option>
        </select>
      </div>

      <div class="field" id="campoBombeiro" style="display:none;">
        <label for="bombeiro">Bombeiro</label>
        <select id="bombeiro" required>
          <option value="" disabled selected>Selecione o bombeiro</option>
        </select>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" value="senha123">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <div class="login-foot">
      Grupo HSP · Transformação Digital na Segurança
      <div class="proto-flag">Protótipo de demonstração — dados fictícios</div>
    </div>
  </div>
</div>

<script src="js/staff.js?v=202609120516"></script>
<script>
const equipeSelect = document.getElementById('equipe');
const bombeiroSelect = document.getElementById('bombeiro');
const campoBombeiro = document.getElementById('campoBombeiro');

popularSelectEquipes(equipeSelect);

equipeSelect.addEventListener('change', ()=>{
  popularSelectBombeirosPorEmpresa(bombeiroSelect, equipeSelect.value);
  campoBombeiro.style.display = 'block';
});

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const nome = bombeiroSelect.value;
  if(!nome) return;
  const staff = buscarStaff(nome);
  sessionStorage.setItem('db_usuario', nome);
  sessionStorage.setItem('db_usuario_label', nomeParaLabel(nome));
  if(staff){
    sessionStorage.setItem('db_usuario_empresa', staff.empresa);
    sessionStorage.setItem('db_usuario_funcao', staff.funcao);
  }
  window.location.href = 'app.html';
});
</script>

</body>
</html>
